name: Android verification
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # setup-android defaults to packages 'tools platform-tools'; the legacy 'tools'
      # package no longer exists in Google's SDK repository, so sdkmanager exits 1.
      # Name the packages explicitly instead of relying on that default.
      # From API 37 platforms are minor-versioned: compileSdk 37 is 'platforms;android-37.0'.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :app:checkKotlinFormat :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --console=plain
      - run: python3 scripts/check_android_patterns.py
      - run: python3 scripts/verify_schema_upgrades.py
      - run: python3 scripts/verify_release_apk.py
      # Without KVM the x86_64 emulator runs unaccelerated on hosted runners, and adb sees
      # it as offline until the renderer fails. The runner's own defaults already use
      # swiftshader, -no-snapshot, -no-boot-anim and disabled animations.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain
      # The HTML report only exists inside the uploaded artifact; surface failing
      # instrumented tests directly in the job log so they can be read without it.
      - name: Print instrumented test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for problem in list(case.findall('failure')) + list(case.findall('error')):
                      print(f"::error::{case.get('classname')}.{case.get('name')} ({problem.tag})")
                      print((problem.text or problem.get('message') or '')[:4000])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/
            app/build/outputs/mapping/release/
            build/release-apk-verification.json
