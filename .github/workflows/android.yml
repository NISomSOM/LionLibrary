name: Android verification
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'
      - run: chmod +x gradlew
      - run: ./gradlew :app:checkKotlinFormat :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --console=plain
      - run: python3 scripts/check_android_patterns.py
      - run: python3 scripts/verify_schema_upgrades.py
      - run: python3 scripts/verify_release_apk.py
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/
            app/build/outputs/mapping/release/
            build/release-apk-verification.json
